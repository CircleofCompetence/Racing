<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <title>MINI Racer</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <canvas id="game" aria-label="미니카 레이싱 게임 화면"></canvas>
  <div class="grain"></div>
  <div class="hud">
    <div class="brand">MINI Racer</div>
    <div class="distance"><span id="distance">00000</span> m</div>
    <div class="energy"><span class="energy-label">ENERGY</span><div class="energy-track"><div class="energy-fill" id="energy"></div></div></div>
  </div>
  <div class="speed"><strong id="speed">000</strong><span>MINI KM/H</span></div>
  <button class="sound-toggle" id="soundToggle" aria-label="사운드 켜기">🔊 SOUND ON</button>
  <div class="boost-state" id="boostState">BOOST!</div>
  <div class="controls" aria-label="게임 조작 버튼">
    <button class="ctrl" id="left" aria-label="왼쪽으로 이동"><span>◀</span><small>LEFT</small></button>
    <button class="ctrl boost" id="boost" aria-label="부스터 사용"><span>BOOST</span><small id="boostText">READY</small></button>
    <button class="ctrl" id="right" aria-label="오른쪽으로 이동"><span>▶</span><small>RIGHT</small></button>
  </div>
  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title">MINI<em>Racer</em></h1>
      <p class="tagline" id="tagline">거대한 거실을 질주하라! 장난감을 피하고<br>부스터로 최고 기록을 깨뜨리세요.</p>
      <div class="final-score" id="finalScore"><span>달린 거리</span><b id="finalDistance">0 m</b></div>
      <div class="tips" id="tips">
        <div class="tip"><b>◀ ▶</b><span>누르고<br>좌우 이동</span></div>
        <div class="tip"><b>10×</b><span>충돌하면<br>레이스 종료</span></div>
        <div class="tip"><b>⚡</b><span>한 번 눌러<br>5초 부스터</span></div>
      </div>
      <button class="start" id="start">ENGINE START</button>
      <div class="sound-note">소리가 안 나면 상단 SOUND ON을 눌러주세요 · 세로 화면 추천</div>
    </div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
